name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run test suite
        run: python -m unittest -v
      - name: Lint
        run: |
          python -m pip install pyflakes pycodestyle
          python -m pyflakes markcheck.py test_markcheck.py tools
          python -m pycodestyle markcheck.py test_markcheck.py tools

  web-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Browser build matches the Python module
        run: python tools/check_parity.py
      - name: Committed web build is current
        run: |
          python tools/build_web.py
          git diff --exit-code web/

      - name: Committed man page and completions are current
        run: |
          python tools/build_docs.py
          git diff --exit-code docs completions
