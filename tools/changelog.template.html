<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';
  script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none';
  form-action 'none'; connect-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>markcheck - patch notes</title>
<meta name="description" content="Release history for markcheck, the hidden
Unicode character scanner.">
__SOCIAL__
<style>
__SHARED_CSS__
  .release { padding: 22px 24px; margin: 20px 0; animation: rise .5s var(--ease) both; }
  .release h2 { margin: 0 0 4px; font-size: 15px; }
  .ver {
    display: inline-block; font: 600 13px/1 var(--mono); padding: 7px 12px;
    border-radius: 999px; background: var(--accent); color: #fff;
    letter-spacing: 0.01em;
  }
  .tagline {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--dim); margin: 22px 0 8px; font-weight: 700;
  }
  .tagline.danger { color: var(--high); }
  .release p { margin: 10px 0; color: var(--dim); }
  .release ul { margin: 8px 0; padding-left: 20px; }
  .release li { margin: 7px 0; color: var(--dim); }
  .release strong { color: var(--ink); font-weight: 600; }
  code {
    font: 13px/1.4 var(--mono); padding: 2px 6px; border-radius: 6px;
    background: var(--faint); border: 1px solid var(--edge); color: var(--ink);
    /* Never split a flag across lines: "--min-severity" breaking after the
       first dash reads as a different option entirely. */
    white-space: nowrap;
  }
  .release li, .release p { overflow-wrap: break-word; }
  @media (max-width: 560px) {
    main { padding: 16px 12px 64px; }
    .release { padding: 18px 16px; }
    /* A phone is too narrow to hold the longest identifiers on one line, and
       an unbreakable span would push the whole document sideways. Legibility
       of a wrapped token beats a page that scrolls horizontally. */
    code { white-space: normal; overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>

<nav>
  <span class="wordmark"><span class="dot"></span>markcheck</span>
  <a href="index.html">Scanner</a>
  <a href="about.html">About</a>
  <button class="ghost" id="theme" aria-label="Switch colour theme"
    title="Switch colour theme">◐</button>
</nav>

<main>
  <header class="hero">
    <h1>Patch notes</h1>
    <p>Every release, what changed, and why.</p>
  </header>

__BODY__

  <footer>
    markcheck __VERSION__ &middot; MIT licensed &middot;
    <a href="https://github.com/MavProDev/markcheck" rel="noopener noreferrer">source
    on GitHub</a><br>
    Generated from CHANGELOG.md at build time; never edited by hand.
  </footer>
</main>

<script>
// Mirrors the scanner page so the choice carries across both.
const saved = (function () {
  try { return localStorage.getItem("markcheck-theme"); } catch (e) { return null; }
})();
if (saved) { document.documentElement.setAttribute("data-theme", saved); }
document.getElementById("theme").addEventListener("click", function () {
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const current = document.documentElement.getAttribute("data-theme") ||
    (dark ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("markcheck-theme", next); } catch (e) { /* private */ }
});
</script>
</body>
</html>
